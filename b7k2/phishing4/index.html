<head>

<title>Phishing Awareness Training — Series 4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #ffffff; color: #1a2a3a; min-height: 100vh; }

  .top-bar { background: linear-gradient(135deg, #0077b6, #00b4d8); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
  .top-bar-logo { color: white; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  .top-bar-logo span { opacity: 0.85; font-weight: 400; }

  #app { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

  .progress-container { background: #e8f0f8; border-radius: 20px; height: 8px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #0077b6, #00b4d8); border-radius: 20px; transition: width 0.6s ease; }
  .progress-label { text-align: right; font-size: 12px; color: #334e68; margin-bottom: 6px; font-weight: 600; }

  .slide { display: none; animation: fadeIn 0.5s ease; }
  .slide.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .title-slide { text-align: center; padding: 40px 20px; }
  .shield-icon { font-size: 72px; margin-bottom: 20px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .title-slide h1 { font-size: 2.4em; font-weight: 800; background: linear-gradient(90deg, #0077b6, #00b4d8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .title-slide .subtitle { color: #1e3a52; font-size: 1.1em; margin-bottom: 30px; font-weight: 500; }
  .module-pills { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .pill { background: #dceefb; border: 1px solid #90c4e4; border-radius: 20px; padding: 8px 16px; font-size: 13px; color: #004e89; font-weight: 700; }
  .prepared-by-title { font-size: 13px; color: #1e3a52; margin-bottom: 32px; letter-spacing: 0.3px; font-weight: 500; }
  .prepared-by-title strong { color: #0077b6; }

  .slide-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .slide-tag { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; border-radius: 6px; padding: 4px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .slide-tag.warning { background: linear-gradient(135deg, #e63946, #c1121f); }
  .slide-tag.tip { background: linear-gradient(135deg, #2d6a4f, #40916c); }
  .slide-title { font-size: 1.6em; font-weight: 700; color: #0d1f2d; }

  .card { background: #f0f6fd; border: 1px solid #b8d9f5; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .card.red-accent { border-left: 4px solid #e63946; background: #fff2f3; }
  .card.blue-accent { border-left: 4px solid #00b4d8; }
  .card.green-accent { border-left: 4px solid #40916c; background: #eef8f2; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media(max-width:600px){ .two-col{grid-template-columns:1fr;} }

  .tag-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #1e3a52; margin-bottom: 8px; }
  .tag-label.red { color: #b91c1c; }
  .tag-label.green { color: #166534; }
  ul.check-list { list-style: none; }
  ul.check-list li { padding: 6px 0; padding-left: 24px; position: relative; font-size: 14px; color: #0d1f2d; line-height: 1.5; }
  ul.check-list li::before { content: '✦'; position: absolute; left: 0; color: #0077b6; font-size: 12px; top: 8px; }

  .scenario-number { font-size: 12px; color: #1e3a52; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 700; }
  .scenario-question { font-size: 1.2em; color: #0d1f2d; font-weight: 700; margin-bottom: 20px; line-height: 1.5; }

  .email-box { background: #f9fafc; color: #0d1f2d; border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 2px solid #e63946; }
  .email-header { background: #e4edf7; padding: 14px 18px; border-bottom: 1px solid #c0d4e8; }
  .email-row { display: flex; gap: 10px; margin-bottom: 5px; font-size: 13px; }
  .email-field { color: #1e3a52; font-weight: 700; width: 60px; flex-shrink: 0; }
  .email-value { color: #0d1f2d; font-weight: 500; }
  .email-value.suspicious { color: #b91c1c; font-weight: 700; }
  .email-body { padding: 16px 18px; font-size: 13.5px; line-height: 1.8; color: #0d1f2d; background: #ffffff; }
  .email-link { color: #0055a5; text-decoration: underline; font-weight: 700; }
  .email-link.bad { color: #b91c1c; font-weight: 700; }

  /* Attachment tag */
  .attachment-tag { display: inline-flex; align-items: center; gap: 6px; background: #fff7e6; border: 1px solid #fcd34d; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: #b45309; margin-top: 10px; }

  /* QR code placeholder */
  .qr-placeholder { background: #f0f6fd; border: 2px dashed #90c4e4; border-radius: 10px; padding: 20px; text-align: center; margin: 12px 0; }
  .qr-grid { display: grid; grid-template-columns: repeat(8,16px); gap: 2px; justify-content: center; margin-bottom: 8px; }
  .qr-cell { width: 16px; height: 16px; border-radius: 2px; }

  .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .option-btn { background: #eef5fb; border: 2px solid #90c4e4; border-radius: 10px; padding: 14px 18px; text-align: left; cursor: pointer; color: #0d1f2d; font-size: 14px; font-family: inherit; transition: all 0.2s; line-height: 1.5; font-weight: 500; }
  .option-btn:hover:not(:disabled) { border-color: #0077b6; background: #dceefb; transform: translateX(4px); }
  .option-btn.correct { border-color: #166534; background: #dcfce7; color: #14532d; font-weight: 700; }
  .option-btn.wrong { border-color: #b91c1c; background: #fee2e2; color: #7f1d1d; font-weight: 600; }
  .option-btn:disabled { cursor: default; transform: none; }

  .feedback { border-radius: 10px; padding: 18px; margin-bottom: 20px; display: none; }
  .feedback.correct { background: #dcfce7; border: 2px solid #166534; }
  .feedback.wrong { background: #fee2e2; border: 2px solid #b91c1c; }
  .feedback-icon { font-size: 24px; margin-bottom: 8px; }
  .feedback-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .feedback.correct .feedback-title { color: #14532d; }
  .feedback.wrong .feedback-title { color: #7f1d1d; }
  .feedback-text { font-size: 13px; color: #0d1f2d; line-height: 1.6; font-weight: 500; }

  .score-slide { text-align: center; padding: 20px; }
  .score-circle { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(#00b4d8 0deg, #0077b6 var(--score-deg), #c8dff0 var(--score-deg)); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .score-inner { width: 110px; height: 110px; border-radius: 50%; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #b8d9f5; }
  .score-number { font-size: 2.2em; font-weight: 800; color: #004e89; }
  .score-label { font-size: 11px; color: #1e3a52; font-weight: 700; }
  .score-message { font-size: 1.3em; font-weight: 700; margin-bottom: 10px; color: #0d1f2d; }
  .score-sub { font-size: 14px; color: #1e3a52; margin-bottom: 30px; font-weight: 500; }
  .review-cards { text-align: left; }
  .review-item { background: #f0f6fd; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; border-left: 4px solid; }
  .review-item.pass { border-color: #166534; background: #dcfce7; }
  .review-item.fail { border-color: #b91c1c; background: #fee2e2; }
  .review-item-label { font-size: 11px; color: #1e3a52; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .review-item-text { font-size: 13px; color: #0d1f2d; font-weight: 500; }

  .btn { border: none; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .btn-primary { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 2px solid #0077b6; color: #0055a5; font-weight: 700; }
  .btn-outline:hover { border-color: #004e89; background: #dceefb; color: #004e89; }
  .btn-group { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-group.center { justify-content: center; }

  .tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media(max-width:600px){ .tips-grid{grid-template-columns:1fr;} }
  .tip-card { background: #f0f6fd; border-radius: 10px; padding: 18px; border: 1px solid #b8d9f5; border-top: 3px solid #0077b6; }
  .tip-num { font-size: 28px; font-weight: 800; color: #90c4e4; margin-bottom: 6px; }
  .tip-title { font-size: 13px; font-weight: 700; color: #004e89; margin-bottom: 6px; }
  .tip-desc { font-size: 12px; color: #1e3a52; line-height: 1.5; font-weight: 500; }

  .red-flag-tag { display: inline-block; background: #fee2e2; color: #7f1d1d; border: 1px solid #b91c1c; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; margin: 2px; }

  .site-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #e8f2fa; border-top: 2px solid #90c4e4; padding: 10px 24px; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 100; }
  .site-footer span { font-size: 12px; color: #1e3a52; font-weight: 600; }
  .site-footer strong { color: #004e89; font-size: 12px; font-weight: 700; }
  .footer-divider { color: #90c4e4; font-weight: 700; }
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-bar-logo">🛡️ <span>Phishing Awareness Training — Series 4</span></div>
</div>
<div id="app">
  <div class="progress-label" id="progressLabel">Introduction</div>
  <div class="progress-container"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div id="slides"></div>
</div>

<script>
(function(){
  const pwd = prompt("Enter Password To Access The Training:");
  if(pwd !== "Bonton2026"){
    document.body.innerHTML = `
      <div style="text-align:center; margin-top:150px; font-family:Arial;">
        <h2 style="color:#e63946;">⛔ Access Denied</h2>
        <p style="color:#1e3a52;">Contact your IT team for access.</p>
      </div>`;
  }
})();

const slides = [
  { type: 'title' },
  { type: 'info', tag: 'Series 4 Focus', title: 'Malware, Ransomware & Attachment Attacks', content: 'info1' },
  { type: 'info', tag: 'Key Concepts', title: 'How Malicious Files & QR Codes Are Used', content: 'info2' },
  { type: 'quiz', scenarioNum: 1, label: 'Scenario 1 of 4 — Fake Salary Slip Attachment' },
  { type: 'quiz', scenarioNum: 2, label: 'Scenario 2 of 4 — Malicious Invoice Document' },
  { type: 'quiz', scenarioNum: 3, label: 'Scenario 3 of 4 — QR Code Phishing (Quishing)' },
  { type: 'quiz', scenarioNum: 4, label: 'Scenario 4 of 4 — Fake Software Update' },
  { type: 'info', tag: 'Best Practices', title: '5 Golden Rules for Attachments & Malware Defence', content: 'tips' },
  { type: 'info', tag: 'Action Plan', title: 'If You Opened a Suspicious File — What To Do', content: 'whattodo' },
  { type: 'info', tag: 'Quick Reference', title: 'Attachment & Malware Detection Checklist', content: 'checklist' },
  { type: 'score' }
];

const scenarios = [
  {
    // SCENARIO 1: Attacker pretends to be Bonton's own HR team sending a salary slip.
    // Sender uses a fake Bonton-looking domain. Recipient is Neha Joshi, an office staff member.
    // Body greets Neha by name. Attachment is a .zip file — dangerous, not a PDF.
    // Red flag: sender email domain is wrong, and salary slips are never sent as .zip files.
    from: {
      displayName: "HR & Payroll Team — Bonton Furniture",
      email: "hr.payroll@bontonfurniture-hrsystem.com",
      suspicious: true
    },
    to: {
      displayName: "Neha Joshi — Office Administrator, Bonton Furniture",
      email: "neha.joshi@bontonfurniture.net"
    },
    whoAmI: "You are <strong>Neha Joshi, Office Administrator at Bonton Furniture, Indore.</strong> This email has just arrived in your inbox, appearing to come from your own HR team.",
    subject: "Your April 2026 Salary Slip — Please Open and Save",
    date: "Monday, 6 April 2026, 9:00 AM",
    body: `Dear Neha,<br><br>Please find your salary slip for April 2026 attached to this email. This document contains your salary details, deductions, and take-home amount for the month.<br><br>Kindly open and save a copy for your records.<br><br><span class="attachment-tag">📎 April_2026_SalarySlip_Neha_Joshi.zip</span><br><br>If you notice any issues with your salary, please contact the HR department.<br><br>Regards,<br>HR & Payroll Team<br>Bonton Furniture`,
    question: "This email looks like it came from Bonton's own HR team and contains Neha's salary slip. What is the biggest warning sign?",
    options: [
      "Salary slips usually come as PDF files, not .zip files.",
      "The sender's email address ends in 'bontonfurniture-hrsystem.com' — this is NOT Bonton's real email. Bonton's real email ends in 'bontonfurniture.net'. Also, salary slips are never sent as .zip files — opening this file could seriously harm your computer.",
      "The email arrived on a Monday morning, which is unusual for HR emails.",
      "The email does not mention Neha's employee number."
    ],
    correct: 1,
    explanation: "Neha received this email from someone pretending to be Bonton's HR team. Look at the sender's email — it ends in 'bontonfurniture-hrsystem.com'. Bonton's real emails always end in 'bontonfurniture.net'. That extra part — 'hrsystem' — has been added by the scammer to make it look official. The attachment is also a .zip file, not a PDF. Bonton HR always sends salary slips as PDF files through the official system. A .zip file from an unknown sender can contain a harmful program that — once opened — can silently take over your computer, steal your passwords, or lock all your files. Never open a .zip file attached to an unexpected email. Report it to IT straight away.",
    redFlags: ["Sender email ends in 'bontonfurniture-hrsystem.com' — not Bonton's real email 'bontonfurniture.net'", "Salary slip sent as a .zip file — Bonton HR always uses PDF", "Opening a .zip file from an unknown sender can harm your computer"]
  },
  {
    // SCENARIO 2: Attacker pretends to be Kapoor & Sons (a real Bonton fabric supplier)
    // sending an invoice to Bonton's accounts team.
    // Sender uses a fake domain. Real Kapoor & Sons email is @kapoorandsons.com.
    // Attachment is a .docm file — a Word document with hidden harmful code inside.
    // Red flag: sender domain is wrong, and the file type is dangerous.
    from: {
      displayName: "Kapoor & Sons Fabric Supplies",
      email: "accounts@kapoorandsons-pvt.net",
      suspicious: true
    },
    to: {
      displayName: "Mahesh Patil — Accounts Manager, Bonton Furniture",
      email: "Mahesh.Patil@bontonfurniture.net"
    },
    whoAmI: "You are <strong>Mahesh Patil, Accounts Manager at Bonton Furniture, Indore.</strong> Kapoor & Sons is a fabric supplier that Bonton regularly works with. Their real email address ends in '@kapoorandsons.com'. This email has just arrived in your inbox.",
    subject: "Invoice #KS-2026-0447 — Fabric Supply, March 2026",
    date: "Tuesday, 7 April 2026, 11:45 AM",
    body: `Dear Mahesh,<br><br>Please find attached our invoice #KS-2026-0447 for the supply of upholstery fabric delivered to your Indore facility in March 2026.<br><br><strong>Amount payable:</strong> INR 3,42,000<br><strong>Payment due by:</strong> 15 April 2026<br><br>Please open the attached invoice, check the details, and process the payment at your earliest convenience.<br><br><span class="attachment-tag">📎 Invoice_KS-2026-0447_KapoorSons.docm</span><br><br>Thank you for your continued business.<br><br>Warm regards,<br>Accounts Team<br>Kapoor & Sons Fabric Supplies`,
    question: "Mahesh knows Kapoor & Sons well — they are a regular supplier. This invoice looks genuine. What should stop him from opening the attachment?",
    options: [
      "The invoice amount of INR 3,42,000 is too high to process without approval.",
      "The sender's email ends in 'kapoorandsons-pvt.net' — not the real '@kapoorandsons.com'. Also, the file attached is a '.docm' file, not a PDF. This type of file can contain hidden harmful code that runs the moment you open it.",
      "Real invoices are always sent as PDF files — this is common knowledge.",
      "Mahesh should have received this invoice through the company's purchase order system, not by email."
    ],
    correct: 1,
    explanation: "Mahesh received this from someone pretending to be Kapoor & Sons. The sender's email ends in 'kapoorandsons-pvt.net' — but Kapoor & Sons' real email ends in 'kapoorandsons.com'. That is a clear sign this email is fake. The attachment is also a '.docm' file — this is a special type of Word document that can have a hidden programme inside it. When you open it, Word may show a message saying 'Enable Content' or 'Enable Macros' — if you click that, the hidden programme runs immediately. It can then secretly install harmful software on your computer and spread it across the Bonton network. Real invoices from suppliers always come as standard PDF files. If you receive a '.docm' file from any supplier, do not open it — report it to IT Security straight away.",
    redFlags: ["Sender email ends in 'kapoorandsons-pvt.net' — not the real '@kapoorandsons.com'", "File is '.docm' — not a safe PDF — and can run hidden harmful code", "If Word asks you to 'Enable Content' after opening — close the file immediately and call IT"]
  },
  {
    // SCENARIO 3: This is the trickiest scenario.
    // The sender email IS Bonton's real domain — bontonfurniture.net.
    // But the email contains a QR code. When scanned, the QR code takes the employee
    // to a fake website — b0nton-verify.ru — which steals their login details.
    // The lesson: even if the sender email looks real, QR codes hide where they go.
    // You must always check where a QR code takes you BEFORE doing anything.
    from: {
      displayName: "IT Security Team — Bonton Furniture",
      email: "it.security@bontonfurniture.net",
      suspicious: false
    },
    to: {
      displayName: "Vikram Desai — Sales Executive, Bonton Furniture",
      email: "vikram.desai@bontonfurniture.net"
    },
    whoAmI: "You are <strong>Vikram Desai, Sales Executive at Bonton Furniture, Indore.</strong> This email has just arrived in your inbox. Notice that the sender's email address looks like it really came from Bonton — but read carefully before acting.",
    subject: "Urgent: Unusual Login Detected — Please Verify Your Account Now",
    date: "Wednesday, 8 April 2026, 3:20 PM",
    body: `Dear Vikram,<br><br>Our system has detected an unusual login attempt on your Bonton Furniture account from an unknown location. To protect your account, please verify your identity by scanning the QR code below on your mobile phone within 30 minutes.<br><br><div style="background:#f0f6fd;border:2px dashed #90c4e4;border-radius:10px;padding:20px;text-align:center;margin:12px 0;">
      <div style="font-size:40px;margin-bottom:8px;">▦</div>
      <div style="font-size:12px;font-weight:700;color:#b91c1c;margin-bottom:6px;">⚠️ TRAINING NOTE — Do not scan this in real life</div>
      <div style="font-size:12px;color:#374151;font-weight:600;">If this were a real attack, scanning this QR code would take you to:<br><strong style="color:#b91c1c;">http://b0nton-verify.ru/account/qr-auth</strong><br><span style="font-size:11px;color:#6b7280;">(Notice: 'b0nton' uses the number zero, not the letter 'o'. This is a fake website.)</span></div>
    </div><br>If you do not verify within 30 minutes, your account will be temporarily locked.<br><br>IT Security Team<br>Bonton Furniture`,
    question: "The sender's email looks like it really came from Bonton — 'it.security@bontonfurniture.net'. But there is still a serious problem. What is it?",
    options: [
      "The IT Security team should always call first before sending security alerts by email.",
      "The 30-minute deadline to scan is designed to make you act quickly without thinking.",
      "Even though the sender email looks real, a QR code hides where it actually takes you. This QR code leads to a fake website — 'b0nton-verify.ru' — which uses the number zero instead of the letter 'o' and is not a Bonton website at all. Bonton IT never uses QR codes to verify accounts.",
      "Vikram's employee ID was not mentioned in the email."
    ],
    correct: 2,
    explanation: "This is the trickiest type of scam email — the sender's email address looks completely genuine. But the danger is hidden in the QR code. Unlike a normal web link where you can hover your mouse to see where it goes, a QR code hides its destination until you have already scanned it. In this case, the QR code would take Vikram to a fake website — 'b0nton-verify.ru'. Look carefully: the word 'b0nton' uses the number zero (0) instead of the letter 'o'. It is not Bonton's real website. The '.ru' ending is a Russia-based web address — completely unrelated to Bonton Furniture. If Vikram entered his Bonton login details on that fake page, the scammer would immediately have access to his email, files, and company systems. The Bonton IT team never asks employees to verify accounts by scanning a QR code. If you ever receive such a request, call IT directly using the number in the company directory.",
    redFlags: ["QR code hides where it takes you — you cannot check it by hovering", "Fake website address: 'b0nton-verify.ru' uses number zero, not letter 'o'", "'.ru' web address has nothing to do with Bonton Furniture", "Bonton IT never verifies accounts via QR code", "30-minute pressure to act without thinking"]
  },
  {
    // SCENARIO 4: Attacker pretends to be Corepath IT Support sending a software update.
    // Sender uses a fake Corepath-looking domain. Corepath's real email is @corepath.in.
    // Link asks employee to download and run a .exe file.
    // Red flag: sender domain is wrong, Corepath never sends software via email links,
    // and .exe files downloaded from email can harm your computer.
    from: {
      displayName: "Corepath IT Support",
      email: "it-support@corepath-updates.net",
      suspicious: true
    },
    to: {
      displayName: "Sunil Sharma — Warehouse Supervisor, Bonton Furniture",
      email: "sunil.sharma@bontonfurniture.net"
    },
    whoAmI: "You are <strong>Sunil Sharma, Warehouse Supervisor at Bonton Furniture, Indore.</strong> Corepath IT Consulting manages Bonton's computers and systems. Their real email address ends in '@corepath.in'. This email has just arrived in your inbox.",
    subject: "Action Required — Security Update for Your Computer, Complete by 5 PM Today",
    date: "Thursday, 9 April 2026, 10:05 AM",
    body: `Dear Sunil,<br><br>Our team has found a security problem with the Windows software on your computer. This needs to be fixed urgently.<br><br>Please download and install the security update using the link below before 5 PM today. If not done in time, your computer may be disconnected from the Bonton network.<br><br><span class="email-link bad">[ DOWNLOAD UPDATE → http://corepath-secpatch.in/bonton/update-april2026.exe ]</span><br><br>If you face any trouble, reply to this email or contact support@corepath-updates.net.<br><br>Corepath IT Support`,
    question: "This email says it is from Corepath IT Support and asks Sunil to download and install a security update. What should Sunil do?",
    options: [

        <button class="btn btn-outline" onclick="prevSlide()">← Back</button>
        <button class="btn btn-primary" onclick="nextSlide()">See My Score →</button>
      </div>
    </div>`;

  } else if (slide.type === 'score') {
    const score = answers.filter((a, i) => a === scenarios[i].correct).length;
    const pct = Math.round((score / 4) * 100);
    const deg = Math.round((pct / 100) * 360);
    let msg, sub;
    if (score === 4) { msg = "Outstanding! 🏆"; sub = "You spotted all four scam emails correctly. You know exactly what to look for when a dangerous file or QR code arrives in your inbox. Well done!"; }
    else if (score === 3) { msg = "Great Work! 👍"; sub = "You spotted 3 out of 4 scam emails. Read through the explanation for the one you missed — it will help you catch it next time."; }
    else if (score === 2) { msg = "Good Effort 🎯"; sub = "You spotted 2 out of 4 scam emails. File attachment scams can be tricky — read through each explanation carefully and try again."; }
    else { msg = "Keep Practising 📚"; sub = "These scam emails are designed to look very real. Read through each explanation carefully, share what you have learned with your team, and try the training again."; }

    const reviewItems = scenarios.map((sc, i) => {
      const pass = answers[i] === sc.correct;
      return `<div class="review-item ${pass ? 'pass' : 'fail'}">
        <div class="review-item-label">Scenario ${i+1} — ${pass ? '✅ Correct' : '❌ Missed'}</div>
        <div class="review-item-text">${pass ? 'Great — you spotted the key indicator.' : `Correct answer: ${sc.options[sc.correct]}`}</div>
      </div>`;
    }).join('');

    html = `<div class="slide active score-slide">
      <h2 style="color:#0d1f2d;margin-bottom:20px;">Series 4 Complete!</h2>
      <div class="score-circle" style="--score-deg:${deg}deg">
        <div class="score-inner">
          <span class="score-number">${score}/4</span>
          <span class="score-label">${pct}%</span>
        </div>
      </div>
      <div class="score-message">${msg}</div>
      <div class="score-sub">${sub}</div>
      <div class="review-cards">${reviewItems}</div>
      <div style="margin-top:24px;background:#eef5fb;border:1px solid #b8d9f5;border-radius:12px;padding:20px;text-align:left;">
        <div style="font-size:13px;font-weight:700;color:#004e89;margin-bottom:10px;">🎓 You Have Completed Series 4!</div>
        <p style="font-size:13px;color:#1e3a52;line-height:1.7;font-weight:500;">You have now completed Series 4 of the Bonton Phishing Awareness Programme — covering fake attachments, QR code scams, and fake software update emails. You are better prepared to protect yourself, your colleagues, and Bonton Furniture from these kinds of attacks.</p>
      </div>
      <div class="btn-group center" style="margin-top:24px;">
        <button class="btn btn-outline" onclick="restartTraining()">🔄 Retake Training</button>
      </div>
    </div>`;
  }

  container.innerHTML = html;
  updateProgress();
}

function updateProgress() {
  const pct = (currentSlide / (slides.length - 1)) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  const labels = ['Introduction','Series 4 Focus','File Types & QR Codes','Scenario 1','Scenario 2','Scenario 3','Scenario 4','Golden Rules','What To Do','Quick Reference','Your Results'];
  document.getElementById('progressLabel').textContent = labels[currentSlide] || '';
}

function nextSlide() {
  if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(currentSlide); window.scrollTo(0,0); }
}
function prevSlide() {
  if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide); window.scrollTo(0,0); }
}
function selectAnswer(qIdx, optionIdx) {
  answers[qIdx] = optionIdx;
  renderSlide(currentSlide);
}
function restartTraining() {
  answers = [null, null, null, null];
  currentSlide = 0;
  renderSlide(0);
  window.scrollTo(0,0);
}

renderSlide(0);
</script>
